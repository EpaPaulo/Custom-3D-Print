<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consola de encomendas — FormCAT</title>
<style>
  :root {
    --bg:#0f1216; --panel:#161b22; --panel-2:#1c232c; --line:#2a323d;
    --text:#e6edf3; --muted:#8b98a8; --accent:#f5a524; --ok:#3fb950; --bad:#f85149;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:16px; font-weight:600; }
  h1 span { color:var(--accent); }
  .spacer { flex:1; }
  input, select, button { font:inherit; font-size:13px; }
  input, select { background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 9px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  button { background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1a1204; font-weight:600; }
  main { padding:18px; max-width:1100px; margin:0 auto; }
  .msg { margin:0 0 14px; padding:9px 12px; border-radius:8px; font-size:13px; display:none; }
  .msg.on { display:block; }
  .msg.err { background:rgba(248,81,73,.12); color:var(--bad); }
  .msg.ok { background:rgba(63,185,80,.12); color:var(--ok); }
  .order { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:12px; }
  .order-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .order-head h2 { margin:0; font-size:15px; }
  .who { color:var(--muted); font-size:13px; }
  .tag { font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .tag.new { color:var(--accent); border-color:var(--accent); }
  .tag.approved, .tag.printed { color:var(--ok); border-color:var(--ok); }
  .tag.rejected { color:var(--bad); border-color:var(--bad); }
  .item { display:flex; gap:14px; align-items:flex-start;
    border-top:1px dashed var(--line); padding-top:12px; margin-top:12px; }
  .item img { width:132px; height:96px; object-fit:contain; background:var(--panel-2);
    border:1px solid var(--line); border-radius:8px; }
  .item .body { flex:1; min-width:0; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:6px 0 10px; font-size:13px; }
  dt { color:var(--muted); }
  dd { margin:0; font-variant-numeric:tabular-nums; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .empty { color:var(--muted); }
  code { background:var(--panel-2); padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>

<header>
  <h1>Consola de <span>encomendas</span></h1>
  <div class="spacer"></div>
  <select id="filter">
    <option value="">Todas</option>
    <option value="new" selected>Novas</option>
    <option value="approved">Aprovadas</option>
    <option value="printed">Impressas</option>
    <option value="rejected">Rejeitadas</option>
  </select>
  <input id="token" type="password" placeholder="ADMIN_TOKEN" size="26" autocomplete="off">
  <button class="primary" id="load">Carregar</button>
</header>

<main>
  <p class="msg" id="msg"></p>
  <div id="orders"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const KEY = 'lego-admin-token';

// The token lives in this browser only. It never reaches the page from the
// server, and every request carries it explicitly.
$('token').value = sessionStorage.getItem(KEY) || '';

function say(text, kind) {
  const el = $('msg');
  el.className = 'msg on ' + (kind || '');
  el.textContent = text;
  if (!text) el.className = 'msg';
}

async function api(path, options = {}) {
  const token = $('token').value.trim();
  const res = await fetch('/api/admin' + path, {
    ...options,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(options.headers || {}) },
  });
  if (res.status === 401) throw new Error('Token recusado.');
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || ('HTTP ' + res.status));
  return res.json();
}

async function load() {
  const token = $('token').value.trim();
  if (!token) return say('Introduza o ADMIN_TOKEN.', 'err');
  sessionStorage.setItem(KEY, token);
  say('A carregar…');
  try {
    const status = $('filter').value;
    render(await api('/orders' + (status ? '?status=' + encodeURIComponent(status) : '')));
    say('');
  } catch (err) {
    say(err.message, 'err');
  }
}

function render(orders) {
  const host = $('orders');
  host.innerHTML = '';
  if (!orders.length) {
    host.innerHTML = '<p class="empty">Nenhuma encomenda com este estado.</p>';
    return;
  }
  for (const order of orders) host.appendChild(orderCard(order));
}

function orderCard(order) {
  const el = document.createElement('article');
  el.className = 'order';

  const head = document.createElement('div');
  head.className = 'order-head';
  head.innerHTML =
    '<h2>#' + esc(order.orderNumber ?? order.orderId) + '</h2>' +
    '<span class="tag ' + esc(order.status) + '">' + esc(order.status) + '</span>' +
    '<span class="who">' + esc([order.customer?.name, order.customer?.email].filter(Boolean).join(' · ')) + '</span>' +
    '<span class="who">' + esc(new Date(order.createdAt).toLocaleString('pt-PT')) + '</span>';
  el.appendChild(head);

  for (const item of order.items || []) el.appendChild(itemRow(item));

  const actions = document.createElement('div');
  actions.className = 'actions';
  for (const [status, label] of [['approved', 'Aprovar'], ['printed', 'Marcar impressa'], ['rejected', 'Rejeitar']]) {
    const b = document.createElement('button');
    b.textContent = label;
    b.addEventListener('click', async () => {
      try {
        await api('/orders/' + encodeURIComponent(order.orderId) + '/status',
          { method: 'POST', body: JSON.stringify({ status }) });
        say('Encomenda #' + (order.orderNumber ?? order.orderId) + ' → ' + status, 'ok');
        load();
      } catch (err) { say(err.message, 'err'); }
    });
    actions.appendChild(b);
  }
  el.appendChild(actions);
  return el;
}

function itemRow(item) {
  const row = document.createElement('div');
  row.className = 'item';

  const img = document.createElement('img');
  img.alt = '';
  img.src = '/api/designs/' + encodeURIComponent(item.designId) + '/preview.png';
  img.addEventListener('error', () => { img.style.visibility = 'hidden'; });
  row.appendChild(img);

  const body = document.createElement('div');
  body.className = 'body';
  const s = item.spec || {};
  const size = item.size || {};
  body.innerHTML =
    '<strong>' + esc(item.title || 'Placa') + '</strong> × ' + esc(item.quantity) +
    (item.missing ? ' <span class="tag rejected">desenho em falta</span>' : '') +
    '<dl>' +
      row2('Desenho', '<code>' + esc(item.designId) + '</code>') +
      row2('Forma', esc(s.shape || '—')) +
      row2('Grelha', esc(s.width) + ' × ' + esc(s.depth) + ' pinos') +
      row2('Dimensões', size.x ? (size.x + ' × ' + size.y + ' × ' + size.z + ' mm') : '—') +
      row2('Sistema', esc(s.system || '—') + ' · encaixe ' + esc(s.scale ?? '—')) +
      row2('Pinos', esc(s.pattern || '—') + (s.hollowStuds ? ' · ocos' : '')) +
    '</dl>';

  const link = document.createElement('button');
  link.textContent = 'Descarregar STL';
  link.addEventListener('click', () => downloadSTL(item.designId));
  body.appendChild(link);

  row.appendChild(body);
  return row;
}

const row2 = (dt, dd) => '<dt>' + dt + '</dt><dd>' + dd + '</dd>';

// The STL needs the bearer token, which a plain link cannot carry, so it is
// fetched and handed to the browser as a blob.
async function downloadSTL(designId) {
  try {
    say('A gerar o STL…');
    const res = await fetch('/api/admin/designs/' + encodeURIComponent(designId) + '/plate.stl', {
      headers: { Authorization: 'Bearer ' + $('token').value.trim() },
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const name = (res.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name ? name[1] : designId + '.stl';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    say('', '');
  } catch (err) {
    say(err.message, 'err');
  }
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

$('load').addEventListener('click', load);
$('filter').addEventListener('change', load);
$('token').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
if ($('token').value) load();
</script>
</body>
</html>
